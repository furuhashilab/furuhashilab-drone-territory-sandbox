<style>
  :root {
    --team-a: #378ADD;
    --team-b: #D85A30;
    --bg: #f5f4f0;
    --surface: #ffffff;
    --text: #2c2c2a;
    --text-sub: #5f5e5a;
    --border: rgba(100,100,100,0.25);
    --toast-bg: #2c2c2a;
    --toast-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a18;
      --surface: #252523;
      --text: #e8e7e2;
      --text-sub: #a3a29b;
      --border: rgba(200,200,200,0.18);
      --toast-bg: #e8e7e2;
      --toast-text: #1a1a18;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100dvh; }

  .header, .controls {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 8px 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; flex-shrink: 0;
  }
  .header { justify-content: space-between; }
  .header h1 { font-size: 15px; font-weight: 600; }
  .header h1 small { font-size: 11px; color: var(--text-sub); font-weight: 400; margin-left: 4px; }

  .teams { display: flex; gap: 10px; }
  .team-card {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 10px;
    border: 1.5px solid var(--border); font-variant-numeric: tabular-nums; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .team-card.active.a { border-color: var(--team-a); box-shadow: 0 0 0 3px rgba(55,138,221,0.2); }
  .team-card.active.b { border-color: var(--team-b); box-shadow: 0 0 0 3px rgba(216,90,48,0.2); }
  .team-card .name { font-size: 12px; font-weight: 700; }
  .team-card.a .name { color: var(--team-a); }
  .team-card.b .name { color: var(--team-b); }
  .stat { font-size: 13px; font-weight: 600; display: inline-block; }
  .stat small { font-size: 10px; color: var(--text-sub); font-weight: 400; margin-left: 1px; }
  .bump { animation: bump 0.4s ease; }
  @keyframes bump { 40% { transform: scale(1.35); } }

  .progress { flex-basis: 100%; height: 6px; display: flex; border-radius: 3px; overflow: hidden; background: var(--border); }
  .progress div { transition: width 0.4s ease; }

  .label { font-size: 12px; color: var(--text-sub); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    min-height: 36px; padding: 0 14px; border-radius: 18px;
    border: 1.5px solid var(--border); background: transparent; color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn.a { border-color: var(--team-a); color: var(--team-a); }
  .btn.b { border-color: var(--team-b); color: var(--team-b); }
  .btn.a.active { background: var(--team-a); color: #fff; }
  .btn.b.active { background: var(--team-b); color: #fff; }
  .btn.base.active { background: var(--text); color: var(--surface); border-color: var(--text); }
  .btn.fly { background: var(--text); color: var(--surface); border-color: var(--text); }
  .spacer { flex: 1; }

  #map { flex: 1; min-height: 0; position: relative; }

  .room-label {
    font-size: 11px; font-weight: 600; color: #2c2c2a;
    background: rgba(255,255,255,0.8); padding: 1px 5px; border-radius: 3px;
    pointer-events: none; white-space: nowrap; transition: background 0.3s, color 0.3s;
  }
  .room-label.cap-a { background: var(--team-a); color: #fff; }
  .room-label.cap-b { background: var(--team-b); color: #fff; }
  .hide-labels .room-label { display: none; }

  .base-label {
    font-size: 10px; font-weight: 800; color: #fff; padding: 2px 6px; border-radius: 8px;
    pointer-events: none; letter-spacing: 0.05em;
  }

  /* ドローン */
  .drone { width: 44px; height: 44px; pointer-events: none; }
  .drone .bob { width: 100%; height: 100%; animation: bob 1.6s ease-in-out infinite; }
  .drone .body { width: 100%; height: 100%; transition: transform 0.15s linear; }
  .drone .rotor { transform-box: fill-box; transform-origin: center; animation: spin 0.18s linear infinite; }
  .drone.takeoff .bob { animation: takeoff 1.1s ease-in-out; }
  .drone .shadow { position: absolute; left: 50%; top: 50%; width: 26px; height: 10px; margin: 14px 0 0 -13px;
    border-radius: 50%; background: rgba(0,0,0,0.25); filter: blur(2px); animation: shadow 1.6s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  @keyframes shadow { 50% { transform: scale(0.8); opacity: 0.6; } }
  @keyframes takeoff { 0% { transform: none; } 40% { transform: translateY(-22px) scale(1.25) rotate(180deg); } 100% { transform: rotate(360deg); } }

  /* 取得時の波紋 */
  .ripple { width: 18px; height: 18px; border-radius: 50%; border: 3px solid; pointer-events: none;
    animation: ripple 0.7s ease-out forwards; }
  @keyframes ripple { from { transform: scale(0.3); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
  .float-text { font-size: 13px; font-weight: 800; pointer-events: none; text-shadow: 0 1px 2px rgba(255,255,255,0.9);
    animation: floatup 0.9s ease-out forwards; }
  @keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-28px); opacity: 0; } }

  /* 制圧バナー */
  .banner {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0.6);
    padding: 14px 26px; border-radius: 14px; color: #fff; font-weight: 800; font-size: 20px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; z-index: 5; white-space: nowrap;
  }
  .banner small { display: block; font-size: 12px; font-weight: 600; opacity: 0.9; margin-top: 2px; }
  .banner.show { animation: banner 1.8s ease forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--toast-bg); color: var(--toast-text); padding: 8px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .header, .controls { padding: 8px 12px; }
    .hint { display: none; }
    .team-card { padding: 3px 8px; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  /* ===== ③ 飛行ログ登録（オーバーレイ） ===== */
  .ul-backdrop {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.35);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .ul {
    width: min(480px, 100%); max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto;
    background: var(--bg); color: var(--text); border-radius: 18px 18px 0 0;
    padding: 14px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -8px 30px rgba(0,0,0,0.25); animation: ul-up .28s ease-out both;
    font-variant-numeric: tabular-nums;
  }
  @keyframes ul-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (min-width: 700px) { .ul-backdrop { align-items: center; } .ul { border-radius: 18px; } }
  .ul-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .ul-head .title { font-size: 17px; font-weight: 800; }
  .ul-steps { display: flex; gap: 4px; list-style: none; font-size: 11px; color: var(--text-sub); margin-bottom: 14px; }
  .ul-steps li { flex: 1; }
  .ul-steps li::before { content: ""; display: block; height: 4px; border-radius: 2px; background: var(--border); margin-bottom: 3px; transition: background .3s; }
  .ul-steps li.on { color: var(--text); font-weight: 700; }
  .ul-steps li.on::before, .ul-steps li.past::before { background: var(--accent); }
  .ul-pane { animation: ul-in .25s ease-out both; }
  @keyframes ul-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  .ul p { margin-bottom: 8px; line-height: 1.6; }
  .ul .sub { font-size: 12px; color: var(--text-sub); }
  .ul .who { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  .ul .who input {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--text); min-height: 40px;
  }
  .ul .drop {
    border: 2px dashed var(--border); border-radius: 14px; padding: 22px 14px; text-align: center; background: var(--surface);
    transition: border-color .15s, transform .15s;
  }
  .ul .drop.over { border-color: var(--accent); border-style: solid; transform: scale(1.02); }
  .ul .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .ul .pick {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 22px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .ul .drop:focus-within .pick { outline: 3px solid var(--accent); outline-offset: 3px; }
  .ul .kinds { font-size: 12px; color: var(--text-sub); margin-top: 10px; line-height: 1.6; }
  .ul details { margin-top: 12px; font-size: 13px; }
  .ul summary { cursor: pointer; color: var(--text-sub); padding: 4px 0; }
  .ul .samples { display: grid; gap: 6px; margin-top: 6px; }
  .ul .samples .btn { border-radius: 10px; text-align: left; white-space: normal; padding: 8px 12px; height: auto; }
  .ul .samples .btn small { display: block; font-weight: 400; color: var(--text-sub); font-size: 11px; }
  .ul .err { color: #b3261e; font-weight: 700; font-size: 14px; margin-top: 10px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ul .err { color: #f2867d; } }

  .ul .radar { width: 84px; height: 84px; margin: 12px auto; position: relative; }
  .ul .radar span { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: ul-ping 1.4s ease-out infinite; }
  .ul .radar span:nth-child(2) { animation-delay: .45s; } .ul .radar span:nth-child(3) { animation-delay: .9s; }
  .ul .radar i { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: var(--accent); }
  @keyframes ul-ping { from { transform: scale(.2); opacity: .9; } to { transform: scale(1); opacity: 0; } }
  .ul .checks { list-style: none; margin: 8px auto 0; max-width: 280px; font-size: 14px; }
  .ul .checks li { padding: 3px 0; color: var(--text-sub); }
  .ul .checks li::before { content: "○"; display: inline-block; width: 1.5em; }
  .ul .checks li.ok { color: var(--text); }
  .ul .checks li.ok::before { content: "✓"; color: #2f7d4f; font-weight: 700; }

  .ul .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .ul .card .top { padding: 12px 14px 6px; }
  .ul .card .when { font-size: 12px; color: var(--text-sub); }
  .ul .card .dur { font-size: 38px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
  .ul .card .dur small { font-size: 17px; margin: 0 2px; }
  .ul .card svg { display: block; width: 100%; height: auto; background: var(--bg); }
  .ul .card .notrack { padding: 10px 14px; font-size: 12px; color: var(--text-sub); border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); }
  .ul .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; padding: 10px 14px; font-size: 12px; }
  .ul .facts dt { color: var(--text-sub); }
  .ul .facts dd { font-weight: 700; font-size: 13px; margin-bottom: 4px; overflow-wrap: anywhere; }
  .ul .calc { border-top: 1px dashed var(--border); padding: 10px 14px; font-size: 14px; }
  .ul .calc div { display: flex; justify-content: space-between; padding: 2px 0; }
  .ul .calc .total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; font-weight: 800; font-size: 18px; }
  .ul .note { font-size: 12px; padding: 8px 14px; border-top: 1px dashed var(--border); color: var(--text-sub); }
  .ul .warn { font-size: 12px; padding: 8px 14px; border-top: 1px dashed var(--border); color: #8a5a00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ul .warn { color: #e8b75a; } }
  .ul .blocked { padding: 12px 14px; border-top: 1px solid var(--border); color: #b3261e; font-weight: 700; }
  .ul .row { display: flex; gap: 8px; margin-top: 14px; }
  .ul .row .btn { flex: 1; min-height: 46px; border-radius: 23px; font-size: 15px; }
  .ul .btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ul .done { text-align: center; padding: 12px 0 4px; }
  .ul .done .gain { font-size: 46px; font-weight: 800; color: var(--accent); line-height: 1.2; }
  .ul .can { list-style: none; margin-top: 12px; font-size: 14px; }
  .ul .can li { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px solid var(--border); }
  .ul .can li.no { color: var(--text-sub); }
  .loglist { list-style: none; font-size: 13px; max-height: 40vh; overflow-y: auto; }
  .loglist li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  body[data-team="A"] { --accent: var(--team-a); }
  body[data-team="B"] { --accent: var(--team-b); }

  .ul .close { margin-left: auto; }
  .ul .chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; color: #fff; background: var(--accent); }
  .ul .btn { font: inherit; font-weight: 700; }
  .maperr {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 24px; text-align: center;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.7;
  }

  .ul-backdrop[hidden] { display: none; }

</style>

<body data-team="A">
<div class="app">
  <div class="header">
    <h1>Drone Territory<small>統合プロトタイプ B棟9階（仮ルール・仮レイアウト）</small></h1>
    <div class="teams">
      <div class="team-card a active" id="card-A">
        <span class="name">A</span>
        <span class="stat" id="cells-A">0<small>マス</small></span>
        <span class="stat" id="pts-A">0<small>pt</small></span>
      </div>
      <div class="team-card b" id="card-B">
        <span class="name">B</span>
        <span class="stat" id="cells-B">0<small>マス</small></span>
        <span class="stat" id="pts-B">0<small>pt</small></span>
      </div>

    </div>
    <button class="btn fly" onclick="openUpload()">＋ 飛行ログを登録</button>
    <button class="btn" onclick="showFlightLogs()">ログ</button>
    <span class="spacer"></span>
    <span class="label hint">光っているマスを取れる</span>
    <div class="seg">
      <button class="btn" onclick="fitFloor()">全体</button>
      <button class="btn base active" id="base-map" onclick="setBase('map')">地図</button>
      <button class="btn base" id="base-photo" onclick="setBase('photo')">写真</button>
      <button class="btn" onclick="resetGame()">リセット</button>
    </div>
  </div>

  <div id="map"><div class="banner" id="banner"></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="ul-backdrop" id="upload" hidden onclick="if (event.target === this) closeUpload()">
  <div class="ul" id="ul" role="dialog" aria-modal="true" aria-label="飛行ログを登録"></div>
</div>

<script>
// ---------------------------------------------------------------
// 仮ルール（#4 ポイントルールで議論中。数値はここを変えれば調整できる）
// ---------------------------------------------------------------
// 統合プロトタイプでは docs/game-rules.md 叩き台 v0.3（PR #19）4-2 B棟9階版の提案値を使う。
// （ ）内は ① の PoC の元の値。
const RULES = {
  startPoints: 25,       // 開始時のポイント（5）
  pointsPerMinute: 1,    // 飛行1分あたりのポイント（1）
  costNeutral: 5,        // 未取得マスを取るコスト（1）
  costSteal: 10,         // 相手のマスを奪うコスト（2）
  roomBonus: 15,         // 部屋をすべて取ったときのボーナス（3）
  // ③ ログ登録のルール（叩き台 v0.3 2章）
  dailyCapMinutes: 30,     // 1人1日あたりの上限（分）
  teamSize: { A: 4, B: 3 },// どちらが3人かは未決定。仮で B を3人にしている
  smallTeamMultiplier: 4 / 3,
};

// B棟 9階部分の外形（OpenStreetMap way 361859629 より、© OpenStreetMap contributors / ODbL）
// 実際の間取り・向きとの対応は未決定。部屋の配置は仮レイアウト。
const FOOTPRINT = {
  north: [139.4029451, 35.5665866],
  east:  [139.4031858, 35.5663429],
  west:  [139.4027488, 35.5664583],
};

// 部屋の定義（Reara の PoC と同じ形式・同じ仮レイアウト）
const rooms = [
  { id: 'lab1',    label: '研究室A',     col: 0,  row: 0, cols: 6, rows: 5 },
  { id: 'lab2',    label: '研究室B',     col: 6,  row: 0, cols: 6, rows: 5 },
  { id: 'lab3',    label: '研究室C',     col: 12, row: 0, cols: 6, rows: 5 },
  { id: 'meeting', label: '会議室',      col: 18, row: 0, cols: 4, rows: 5 },
  { id: 'hall',    label: '廊下',        col: 0,  row: 5, cols: 22, rows: 2 },
  { id: 'server',  label: 'サーバー室',  col: 0,  row: 7, cols: 4, rows: 4 },
  { id: 'drone',   label: 'ドローン室',  col: 4,  row: 7, cols: 8, rows: 4 },
  { id: 'lounge',  label: 'ラウンジ',    col: 12, row: 7, cols: 6, rows: 4 },
  { id: 'storage', label: '倉庫',        col: 18, row: 7, cols: 4, rows: 4 },
];
const TOTAL_COLS = 22;
const TOTAL_ROWS = 11;

// 各チームの基地（廊下の両端。奪えない）
const BASES = { A: ['5,0', '6,0'], B: ['5,21', '6,21'] };
const TEAM_COLOR = { A: '#378ADD', B: '#D85A30' };
const other = t => (t === 'A' ? 'B' : 'A');

// ゲームの状態（cellState は Reara の PoC と同じ形式: "row,col" → 'A' | 'B' | null。将来 Supabase と連携予定）
let cellState, points, roomOwner, currentTeam = 'A', flying = false;

// ---------------------------------------------------------------
// 座標
// ---------------------------------------------------------------
function toLngLat(c, r) {
  const u = c / TOTAL_COLS, v = r / TOTAL_ROWS;
  const [nx, ny] = FOOTPRINT.north, [ex, ey] = FOOTPRINT.east, [wx, wy] = FOOTPRINT.west;
  return [nx + u * (ex - nx) + v * (wx - nx), ny + u * (ey - ny) + v * (wy - ny)];
}
function rect(c, r, w, h) {
  return [[toLngLat(c, r), toLngLat(c + w, r), toLngLat(c + w, r + h), toLngLat(c, r + h), toLngLat(c, r)]];
}
const keyOf = (r, c) => `${r},${c}`;
const idOf = key => { const [r, c] = key.split(',').map(Number); return r * TOTAL_COLS + c; };
const rcOf = key => key.split(',').map(Number);

const cellFeatures = [];
const cellRoom = {};   // key → room
rooms.forEach(room => {
  for (let r = 0; r < room.rows; r++) for (let c = 0; c < room.cols; c++) {
    const gr = room.row + r, gc = room.col + c, key = keyOf(gr, gc);
    cellRoom[key] = room;
    cellFeatures.push({ type: 'Feature', id: idOf(key), properties: { key },
      geometry: { type: 'Polygon', coordinates: rect(gc, gr, 1, 1) } });
  }
});
const roomFeatures = rooms.map((room, i) => ({ type: 'Feature', id: i, properties: { label: room.label },
  geometry: { type: 'Polygon', coordinates: rect(room.col, room.row, room.cols, room.rows) } }));

// ---------------------------------------------------------------
// 地図
// ---------------------------------------------------------------
const GSI = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>';
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron', // OpenFreeMap（APIキー不要）
  center: toLngLat(TOTAL_COLS / 2, TOTAL_ROWS / 2),
  zoom: 19, maxZoom: 22,
  pitchWithRotate: false, dragRotate: false,
});
map.touchZoomRotate.disableRotation();

// 背景地図（OpenFreeMap）が読めない環境（オフライン・プレビューなど）では無地の背景に切り替え、
// フロアのマスと部屋（このファイル内のデータ）だけで遊べるようにする
let usedFallback = false;
function useFallbackStyle() {
  if (usedFallback || map.isStyleLoaded()) return;
  usedFallback = true;
  map.setStyle({ version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': getComputedStyle(document.body).backgroundColor } }] });
  setTimeout(() => showToast('背景地図を読み込めないため、無地の背景で表示しています'), 800);
}
map.on('error', () => { if (!map.isStyleLoaded()) useFallbackStyle(); });
setTimeout(useFallbackStyle, 6000);
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.once('style.load', () => {
  map.addSource('photo', { type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'],
    tileSize: 256, maxzoom: 18, attribution: GSI });
  map.addSource('cells', { type: 'geojson', data: { type: 'FeatureCollection', features: cellFeatures } });
  map.addSource('rooms', { type: 'geojson', data: { type: 'FeatureCollection', features: roomFeatures },
    attribution: 'B棟外形 © <a href="https://www.openstreetmap.org/way/361859629" target="_blank">OpenStreetMap contributors</a>' });
  map.addSource('trail', { type: 'geojson', data: emptyLine() });

  map.addLayer({ id: 'photo', type: 'raster', source: 'photo', layout: { visibility: 'none' } });
  map.addLayer({ id: 'cells-fill', type: 'fill', source: 'cells', paint: {
    'fill-color': ['match', ['feature-state', 'owner'], 'A', TEAM_COLOR.A, 'B', TEAM_COLOR.B, '#ffffff'],
    'fill-opacity': ['case',
      ['boolean', ['feature-state', 'base'], false], 0.9,
      ['boolean', ['feature-state', 'hover'], false], 0.8,
      ['any', ['==', ['feature-state', 'owner'], 'A'], ['==', ['feature-state', 'owner'], 'B']], 0.6,
      0.4],
    'fill-opacity-transition': { duration: 300 } } });
  map.addLayer({ id: 'cells-line', type: 'line', source: 'cells', paint: { 'line-color': '#5f5e5a', 'line-width': 0.5, 'line-opacity': 0.6 } });
  // 取れるマスの光る枠（点滅は pulse() で line-opacity を動かす）
  map.addLayer({ id: 'cells-claimable', type: 'line', source: 'cells', paint: {
    'line-color': '#f5c518', 'line-width': 2.5,
    'line-opacity': ['case', ['boolean', ['feature-state', 'claimable'], false], 1, 0],
    'line-opacity-transition': { duration: 800 } } });
  map.addLayer({ id: 'rooms-line', type: 'line', source: 'rooms', paint: {
    'line-color': ['match', ['feature-state', 'captured'], 'A', TEAM_COLOR.A, 'B', TEAM_COLOR.B, '#2c2c2a'],
    'line-width': ['case', ['any', ['==', ['feature-state', 'captured'], 'A'], ['==', ['feature-state', 'captured'], 'B']], 4, 2] } });
  map.addLayer({ id: 'trail', type: 'line', source: 'trail', layout: { 'line-cap': 'round' }, paint: {
    'line-color': ['get', 'color'], 'line-width': 3, 'line-dasharray': [1, 1.5], 'line-opacity': 0.9 } });

  fitFloor();
  addMarkers();
  resetGame(true);
  pulse();
});

function emptyLine() { return { type: 'FeatureCollection', features: [] }; }

// 建物の長辺が画面の長い方向に沿うように回転してフロア全体を表示する
function fitFloor() {
  const toM = (a, b) => { const k = 111320 * Math.cos(a[1] * Math.PI / 180); return [(b[0] - a[0]) * k, (b[1] - a[1]) * 111320]; };
  const long = toM(FOOTPRINT.north, FOOTPRINT.east), short = toM(FOOTPRINT.north, FOOTPRINT.west);
  const L = Math.hypot(...long), S = Math.hypot(...short);
  const azimuth = (Math.atan2(long[0], long[1]) * 180 / Math.PI + 360) % 360;
  const { clientWidth: W, clientHeight: H } = map.getContainer();
  const landscape = W >= H, pad = 32;
  const bearing = landscape ? azimuth - 90 : azimuth - 180;
  const mpp = landscape ? Math.max(L / (W - pad * 2), S / (H - pad * 2)) : Math.max(S / (W - pad * 2), L / (H - pad * 2));
  const center = toLngLat(TOTAL_COLS / 2, TOTAL_ROWS / 2);
  const zoom = Math.log2(40075016.686 * Math.cos(center[1] * Math.PI / 180) / (512 * mpp));
  map.jumpTo({ center, zoom: Math.min(zoom - 0.3, 22), bearing });
}
let lastLandscape = null;
window.addEventListener('resize', () => {
  const { clientWidth: W, clientHeight: H } = map.getContainer();
  if ((W >= H) !== lastLandscape) { lastLandscape = W >= H; fitFloor(); }
});

// ---------------------------------------------------------------
// マーカー（部屋名・基地・ドローン）
// ---------------------------------------------------------------
const roomLabels = {};
const drones = {};
function addMarkers() {
  rooms.forEach(room => {
    const el = document.createElement('div');
    el.className = 'room-label';
    el.textContent = room.label;
    roomLabels[room.id] = el;
    new maplibregl.Marker({ element: el }).setLngLat(toLngLat(room.col + room.cols / 2, room.row + room.rows / 2)).addTo(map);
  });
  ['A', 'B'].forEach(t => {
    const el = document.createElement('div');
    el.className = 'base-label';
    el.style.background = TEAM_COLOR[t];
    el.textContent = `${t} 基地`;
    const [r, c] = rcOf(BASES[t][0]);
    new maplibregl.Marker({ element: el, offset: [0, 18] }).setLngLat(toLngLat(c + 0.5, r + 1)).addTo(map);

    const d = document.createElement('div');
    d.className = 'drone';
    d.innerHTML = `<div class="shadow"></div><div class="bob"><div class="body">${droneSvg(TEAM_COLOR[t])}</div></div>`;
    drones[t] = { el: d, marker: new maplibregl.Marker({ element: d }).setLngLat(toLngLat(c + 0.5, r + 1)).addTo(map), pos: [c + 0.5, r + 1] };
  });
  map.on('zoom', updateLabels);
  updateLabels();
}
function setRoomLabel(id, owner) {
  const el = roomLabels[id];
  if (!el) return;
  el.classList.toggle('cap-a', owner === 'A');
  el.classList.toggle('cap-b', owner === 'B');
}
function updateLabels() { map.getContainer().classList.toggle('hide-labels', map.getZoom() < 19); }

function droneSvg(color) {
  const rotor = (x, y) => `<circle cx="${x}" cy="${y}" r="9" fill="rgba(255,255,255,0.35)" stroke="${color}" stroke-width="1.5"/>
    <g class="rotor"><rect x="${x - 8}" y="${y - 1.5}" width="16" height="3" rx="1.5" fill="#2c2c2a"/></g>`;
  return `<svg viewBox="0 0 44 44" width="44" height="44">
    <line x1="10" y1="10" x2="34" y2="34" stroke="#2c2c2a" stroke-width="3"/>
    <line x1="34" y1="10" x2="10" y2="34" stroke="#2c2c2a" stroke-width="3"/>
    ${rotor(10, 10)}${rotor(34, 10)}${rotor(10, 34)}${rotor(34, 34)}
    <rect x="15" y="15" width="14" height="14" rx="4" fill="${color}" stroke="#fff" stroke-width="1.5"/>
    <circle cx="22" cy="17.5" r="1.8" fill="#fff"/>
  </svg>`;
}

// ---------------------------------------------------------------
// ルール
// ---------------------------------------------------------------
function neighbors(key) {
  const [r, c] = rcOf(key);
  return [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].map(([a, b]) => keyOf(a, b)).filter(k => k in cellRoom);
}
function isBase(key) { return BASES.A.includes(key) || BASES.B.includes(key); }
function costOf(team, key) {
  const owner = cellState[key];
  if (owner === team || isBase(key)) return null;
  if (!neighbors(key).some(k => cellState[k] === team)) return null; // 自分の陣地に隣接していないと取れない
  return owner ? RULES.costSteal : RULES.costNeutral;
}

function refreshClaimable() {
  Object.keys(cellRoom).forEach(key => {
    const cost = costOf(currentTeam, key);
    map.setFeatureState({ source: 'cells', id: idOf(key) }, { claimable: cost !== null && cost <= points[currentTeam] });
  });
}

// 取れるマスの枠をゆっくり点滅させる（MapLibre のトランジションで補間。毎フレーム書き換えない）
function pulse() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let bright = true;
  setInterval(() => {
    bright = !bright;
    map.setPaintProperty('cells-claimable', 'line-opacity',
      ['case', ['boolean', ['feature-state', 'claimable'], false], bright ? 1 : 0.3, 0]);
  }, 800);
}

// ---------------------------------------------------------------
// 操作
// ---------------------------------------------------------------
map.on('click', 'cells-fill', e => {
  if (flying) return;
  const key = e.features[0].properties.key;
  const room = cellRoom[key];
  const cost = costOf(currentTeam, key);
  if (isBase(key)) return showToast('基地は奪えません');
  if (cellState[key] === currentTeam) return showToast(`${room.label} — すでに Team ${currentTeam} の陣地`);
  if (cost === null) return showToast('自分の陣地のとなりのマスだけ取れます');
  if (cost > points[currentTeam]) return showToast(`ポイントが足りません（${cost}pt 必要）— 飛行ログを登録しよう`);

  const team = currentTeam;
  const [r, c] = rcOf(key);
  points[team] -= cost;
  updateHud(team, 'pts');
  flyTo(team, [c + 0.5, r + 0.5], () => {
    const stolen = cellState[key] === other(team);
    cellState[key] = team;
    map.setFeatureState({ source: 'cells', id: idOf(key) }, { owner: team });
    effect(toLngLat(c + 0.5, r + 0.5), team, stolen ? `奪取 -${cost}pt` : `-${cost}pt`);
    showToast(stolen ? `Team ${team} が ${room.label} のマスを奪った！` : `Team ${team} が ${room.label} を獲得！`);
    checkRooms(team);
    updateHud(team, 'cells');
    refreshClaimable();
  });
});

let hoverId = null;
map.on('mousemove', 'cells-fill', e => {
  if (hoverId !== null) map.setFeatureState({ source: 'cells', id: hoverId }, { hover: false });
  hoverId = e.features[0].id;
  map.setFeatureState({ source: 'cells', id: hoverId }, { hover: true });
  map.getCanvas().style.cursor = 'pointer';
});
map.on('mouseleave', 'cells-fill', () => {
  if (hoverId !== null) map.setFeatureState({ source: 'cells', id: hoverId }, { hover: false });
  hoverId = null;
  map.getCanvas().style.cursor = '';
});

// ドローンを飛ばす（グリッド座標で補間して、軌跡を描く）
function flyTo(team, to, done) {
  const d = drones[team];
  const from = d.pos.slice();
  const dist = Math.hypot(to[0] - from[0], to[1] - from[1]);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const duration = reduce ? 0 : Math.min(400 + dist * 70, 1400);
  const p0 = map.project(toLngLat(...from)), p1 = map.project(toLngLat(...to));
  const heading = Math.atan2(p1.y - p0.y, p1.x - p0.x) * 180 / Math.PI + 90;
  d.el.querySelector('.body').style.transform = `rotate(${heading}deg)`;
  flying = true;
  const start = performance.now();
  const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  function step(now) {
    const t = duration ? Math.min((now - start) / duration, 1) : 1;
    const k = ease(t);
    const cur = [from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k];
    d.marker.setLngLat(toLngLat(...cur));
    map.getSource('trail').setData({ type: 'FeatureCollection', features: [{ type: 'Feature', properties: { color: TEAM_COLOR[team] },
      geometry: { type: 'LineString', coordinates: [toLngLat(...from), toLngLat(...cur)] } }] });
    if (t < 1) return requestAnimationFrame(step);
    d.pos = to;
    flying = false;
    setTimeout(() => map.getSource('trail').setData(emptyLine()), 250);
    done();
  }
  requestAnimationFrame(step);
}

// 取得時の波紋と浮かぶ文字
function effect(lnglat, team, text) {
  // マーカー要素自体の transform は MapLibre が位置指定に使うので、アニメーションは内側の要素にかける
  const add = (cls, offset, ms, setup) => {
    const wrap = document.createElement('div');
    wrap.style.pointerEvents = 'none';
    const inner = document.createElement('div');
    inner.className = cls;
    setup(inner);
    wrap.appendChild(inner);
    const m = new maplibregl.Marker({ element: wrap, offset }).setLngLat(lnglat).addTo(map);
    setTimeout(() => m.remove(), ms);
  };
  add('ripple', [0, 0], 750, el => { el.style.borderColor = TEAM_COLOR[team]; });
  if (text) add('float-text', [0, -16], 950, el => { el.style.color = TEAM_COLOR[team]; el.textContent = text; });
}

// 部屋をすべて取ったら制圧
function checkRooms(team) {
  rooms.forEach((room, i) => {
    const keys = Object.keys(cellRoom).filter(k => cellRoom[k] === room);
    const owner = keys.every(k => cellState[k] === team) ? team
      : keys.every(k => cellState[k] === other(team)) ? other(team) : null;
    if (owner === roomOwner[room.id]) return;
    const prev = roomOwner[room.id];
    roomOwner[room.id] = owner;
    map.setFeatureState({ source: 'rooms', id: i }, { captured: owner });
    setRoomLabel(room.id, owner);
    if (owner === team) {
      points[team] += RULES.roomBonus;
      updateHud(team, 'pts');
      showBanner(team, `Team ${team} が ${room.label} を制圧！`, `ボーナス +${RULES.roomBonus}pt`);
    } else if (prev && !owner) {
      showToast(`${room.label} の制圧が解除された`);
    }
  });
}

// 飛行ログの登録は ③ の openUpload()（下）に置き換えた

function selectTeam(t) {
  currentTeam = t;
  document.body.dataset.team = t;
  ['A', 'B'].forEach(x => {
    document.getElementById('btn-' + x).classList.toggle('active', x === t);
    document.getElementById('card-' + x).classList.toggle('active', x === t);
  });
  refreshClaimable();
}

function setBase(name) {
  map.setLayoutProperty('photo', 'visibility', name === 'photo' ? 'visible' : 'none');
  document.getElementById('base-map').classList.toggle('active', name === 'map');
  document.getElementById('base-photo').classList.toggle('active', name === 'photo');
}

function resetGame(silent) {
  if (flying) return;
  cellState = {};
  points = { A: RULES.startPoints, B: RULES.startPoints };
  if (typeof flightLogs !== 'undefined') flightLogs = [];
  roomOwner = {};
  Object.keys(cellRoom).forEach(key => map.setFeatureState({ source: 'cells', id: idOf(key) }, { owner: null, base: false }));
  rooms.forEach((room, i) => { map.setFeatureState({ source: 'rooms', id: i }, { captured: null }); setRoomLabel(room.id, null); });
  ['A', 'B'].forEach(t => {
    BASES[t].forEach(key => { cellState[key] = t; map.setFeatureState({ source: 'cells', id: idOf(key) }, { owner: t, base: true }); });
    const [r, c] = rcOf(BASES[t][0]);
    drones[t].pos = [c + 0.5, r + 1];
    drones[t].marker.setLngLat(toLngLat(...drones[t].pos));
  });
  ['A', 'B'].forEach(t => { updateHud(t, 'pts', true); updateHud(t, 'cells', true); });
  refreshClaimable();
  if (!silent) showToast('リセットしました');
}

// ---------------------------------------------------------------
// 表示
// ---------------------------------------------------------------
function updateHud(team, what, quiet) {
  const el = document.getElementById(`${what}-${team}`);
  const value = what === 'pts' ? points[team] : Object.values(cellState).filter(v => v === team).length;
  el.innerHTML = `${value}<small>${what === 'pts' ? 'pt' : 'マス'}</small>`;
  if (!quiet) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  const total = cellFeatures.length;
  const a = Object.values(cellState).filter(v => v === 'A').length;
  const b = Object.values(cellState).filter(v => v === 'B').length;
  document.getElementById('progress').innerHTML =
    `<div style="width:${a / total * 100}%;background:var(--team-a)"></div>` +
    `<div style="flex:1"></div>` +
    `<div style="width:${b / total * 100}%;background:var(--team-b)"></div>`;
}

function showBanner(team, title, sub) {
  const b = document.getElementById('banner');
  b.style.background = TEAM_COLOR[team];
  b.innerHTML = `${title}<small>${sub}</small>`;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ===================================================================
// ③ 飛行ログ登録（ログアップロード画面）
//   - 読み込み: ② worker/internal/gpx の変換ルールを JS に移植（FlightRecord を同じ形で出す）
//               DJI は ② の flightparse が出した FlightRecord JSON を読む
//   - ポイント: docs/game-rules.md 叩き台 v0.3（PR #19）。すべて仮
// ===================================================================

// ---- ② FlightRecord（worker/internal/flightrecord・gpx を移植。項目は #6 で検討中） ----
const FR_LIMIT = { maxDurationSec: 3600, maxAvgSpeedMPS: 25, maxHeightM: 150 }; // flightrecord.go と同じ閾値
const RFC3339 = /^\d{4}-\d{2}-\d{2}[Tt]\d{2}:\d{2}:\d{2}(\.\d+)?([Zz]|[+-]\d{2}:\d{2})$/;

// flightrecord.Validate と同じ判定・同じ文言
function frValidate(r) {
  const w = [];
  if (r.duration_sec <= 0) w.push(`duration_sec が 0 以下です（${r.duration_sec.toFixed(1)} 秒）`);
  else if (r.duration_sec > FR_LIMIT.maxDurationSec) w.push(`duration_sec が ${FR_LIMIT.maxDurationSec} 秒を超えています（${r.duration_sec.toFixed(1)} 秒）`);
  if (r.duration_sec > 0) {
    const avg = r.distance_m / r.duration_sec;
    if (avg > FR_LIMIT.maxAvgSpeedMPS) w.push(`平均速度が ${FR_LIMIT.maxAvgSpeedMPS} m/s を超えています（${avg.toFixed(2)} m/s）`);
  }
  if (r.max_height_m != null && r.max_height_m > FR_LIMIT.maxHeightM) w.push(`max_height_m が ${FR_LIMIT.maxHeightM} m を超えています（${r.max_height_m.toFixed(1)} m）`);
  return w;
}

function frHaversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = Math.PI / 180;
  const s1 = Math.sin((lat2 - lat1) * r / 2), s2 = Math.sin((lon2 - lon1) * r / 2);
  const a = s1 * s1 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * s2 * s2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

async function sha256hex(bytes) {
  if (!(window.crypto && crypto.subtle)) throw new Error('このブラウザではファイルのハッシュを計算できません（https か localhost で開いてください）');
  const h = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// Go の time.Time の JSON（RFC3339・UTC）と同じ見た目にする
const goTime = ms => new Date(ms).toISOString().replace('.000Z', 'Z');

// gpx.Parse の移植。エラー文言もそろえてある
async function parseGPX(bytes) {
  const text = new TextDecoder().decode(bytes);
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('GPX の解析に失敗しました');
  const child = (el, name) => [...el.children].find(c => c.localName === name);
  const points = [];
  for (const trk of [...doc.documentElement.children].filter(c => c.localName === 'trk'))
    for (const seg of [...trk.children].filter(c => c.localName === 'trkseg'))
      for (const pt of [...seg.children].filter(c => c.localName === 'trkpt')) {
        const ele = child(pt, 'ele'), time = child(pt, 'time');
        const e = ele ? Number(ele.textContent.trim()) : null;
        if (ele && !Number.isFinite(e)) throw new Error('GPX の解析に失敗しました（<ele> が数値ではありません）');
        points.push({ lat: Number(pt.getAttribute('lat') || 0), lon: Number(pt.getAttribute('lon') || 0), ele: e, time: time ? time.textContent : null });
      }
  if (points.length < 2) throw new Error(`GPX のトラックポイントが ${points.length} 個しかありません（2 個以上必要）`);

  const times = points.map((p, i) => {
    if (p.time === null) throw new Error(`${i + 1} 番目のトラックポイントに <time> がありません`);
    if (!RFC3339.test(p.time)) throw new Error(`${i + 1} 番目のトラックポイントの <time> を解釈できません ("${p.time}")`);
    return Date.parse(p.time);
  });
  const hasEle = points.every(p => p.ele !== null);
  const started = times[0], ended = times[times.length - 1];
  let distance = 0;
  for (let i = 1; i < points.length; i++) distance += frHaversine(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon);

  const warnings = [];
  let maxHeight = null, base = 0;
  if (hasEle) {
    base = points[0].ele;
    maxHeight = points.reduce((m, p) => Math.max(m, p.ele - base), 0);
  } else {
    warnings.push('<ele> の無いトラックポイントがあるため max_height_m を null にしました');
  }
  const rec = {
    source: 'gpx', parse_level: 'full',
    started_at: goTime(started), ended_at: goTime(ended),
    duration_sec: (ended - started) / 1000,
    distance_m: distance, max_height_m: maxHeight,
    aircraft_name: null, aircraft_id: null,
    file_sha256: await sha256hex(bytes),
    track: points.map((p, i) => ({ t: (times[i] - started) / 1000, lat: p.lat, lon: p.lon, alt_rel: p.ele !== null ? p.ele - base : 0 })),
    warnings,
  };
  rec.warnings.push(...frValidate(rec));
  return rec;
}

// flightparse が出力した FlightRecord JSON を読む（DJI ログはこの形で受け取る）
function readFlightRecordJSON(bytes) {
  let r;
  try { r = JSON.parse(new TextDecoder().decode(bytes)); } catch { throw new Error('JSON として読み込めませんでした'); }
  const need = ['source', 'parse_level', 'started_at', 'ended_at', 'duration_sec', 'file_sha256'];
  const missing = need.filter(k => r == null || r[k] === undefined);
  if (missing.length) throw new Error(`FlightRecord の項目が足りません（${missing.join(', ')}）。② の flightparse の出力を選んでください`);
  if (!RFC3339.test(r.started_at) || !RFC3339.test(r.ended_at)) throw new Error('started_at / ended_at を解釈できません');
  return { distance_m: 0, max_height_m: null, aircraft_name: null, aircraft_id: null, track: [], warnings: [], ...r };
}

// 形式はファイル名ではなく中身で判定する（② flightparse の looksLikeXML と同じ考え方）
function firstChar(bytes) {
  let i = (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) ? 3 : 0;
  for (; i < bytes.length; i++) if (![0x09, 0x0A, 0x0B, 0x0C, 0x0D, 0x20, 0x85, 0xA0].includes(bytes[i])) return String.fromCharCode(bytes[i]);
  return '';
}
async function toFlightRecord(bytes) {
  const c = firstChar(bytes);
  if (c === '<') return parseGPX(bytes);
  if (c === '{') return readFlightRecordJSON(bytes);
  throw new Error('DJI の生ログはブラウザでは読めません。② の flightparse で FlightRecord の JSON に変換してから選んでください（worker/README.md）');
}

// ---- ③ ポイント計算と登録チェック（叩き台 v0.3。未定義の点は仮決め） ----
//  仮決め: 上限を一部超えるログは残り分だけ数える／×4/3 の切り捨てはログ1件ごと／「1日」は日本時間・started_at で区切る
let flightLogs = [];
const player = { name: 'プレイヤー1' };
const jstDay = ms => new Date(ms + 9 * 3600e3).toISOString().slice(0, 10);
const fmtDate = ms => new Date(ms).toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric' });
const fmtTime = ms => new Date(ms).toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit' });
const fmtDur = sec => `${Math.floor(sec / 60)}分${String(Math.floor(sec % 60)).padStart(2, '0')}秒`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const usedMinutes = (name, day) => flightLogs.filter(l => l.player === name && l.day === day).reduce((s, l) => s + l.countedMin, 0);

function evaluateFlight(rec, name, team) {
  const start = Date.parse(rec.started_at), end = Date.parse(rec.ended_at);
  const dup = flightLogs.find(l => l.fileSha256 === rec.file_sha256);
  if (dup) return { blocked: `このログは登録済みです（${fmtDate(dup.registeredAt)} ${dup.player}）` };
  if (start > Date.now() + 5 * 60e3) return { blocked: '未来の日時になっているログは登録できません' };
  const ov = flightLogs.find(l => l.player === name && start < l.endedAt && l.startedAt < end);
  if (ov) return { blocked: `${fmtDate(ov.startedAt)} ${fmtTime(ov.startedAt)}〜${fmtTime(ov.endedAt)} のフライトと時間が重なっています` };
  const minutes = Math.max(0, Math.floor(rec.duration_sec / 60));
  const day = jstDay(start), used = usedMinutes(name, day);
  const counted = Math.min(minutes, Math.max(0, RULES.dailyCapMinutes - used));
  const base = counted * RULES.pointsPerMinute;
  const small = RULES.teamSize[team] === 3;
  const total = Math.floor(base * (small ? RULES.smallTeamMultiplier : 1));
  const notes = [];
  if (minutes === 0) notes.push('1分未満の飛行なので 0pt です（登録はできます）');
  else if (counted === 0) notes.push(`今日はすでに${RULES.dailyCapMinutes}分ぶん登録しています。このログは 0pt です（登録はできます）`);
  else if (counted < minutes) notes.push(`今日はすでに${used}分ぶん登録しています。上限${RULES.dailyCapMinutes}分までの残り${counted}分だけ数えます（仮ルール）`);
  return { start, end, minutes, counted, day, base, bonus: total - base, small, total, notes };
}

const UL_STEPS = ['pick', 'parsing', 'confirm', 'done'];
const ulReduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ulSleep = ms => new Promise(r => setTimeout(r, ulReduce ? 0 : ms));
let ulPending = null;

function openUpload() {

function closeUpload() {

function ulFrame(step, body) {

  const names = { pick: '選ぶ', parsing: '解析', confirm: '確認', done: '完了' };

}

function ulShow(step, err) {
  const box = document.getElementById('ul');
  if (step === 'pick') {
    box.innerHTML = ulFrame('pick', `
      <div class="who"><label for="ul-name">登録する人</label><input id="ul-name" value="${esc(player.name)}" maxlength="20"></div>
      <div class="drop" id="ul-drop">

        <p class="sub" style="margin:8px 0 0">または、ここにドラッグ</p>

      </div>
      ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ''}
      <details${err ? ' open' : ''}><summary>手元にログがないときは、サンプルで試す</summary>
        <div class="samples">${SAMPLES.map((s, i) => `<button class="btn" data-sample="${i}">${esc(s.label)}<small>${esc(s.note)}</small></button>`).join('')}</div>

    const name = document.getElementById('ul-name');

    const drop = document.getElementById('ul-drop');
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));

    drop.addEventListener('drop', async e => { const f = e.dataTransfer.files[0]; if (f) ulHandle(f.name, new Uint8Array(await f.arrayBuffer())); });
    box.querySelectorAll('[data-sample]').forEach(b => b.onclick = () => {

      </div>`);
  }
}

async function ulHandle(fileName, bytes) {
  ulShow('parsing');
  const checks = [...document.querySelectorAll('#ul-checks li')];
  const tick = async (i, ms) => { await ulSleep(ms); checks[i].classList.add('ok'); };
  try {
    const kind = firstChar(bytes) === '<' ? 'GPX' : firstChar(bytes) === '{' ? 'FlightRecord JSON' : '不明';
    await tick(0, 250);
    const rec = await toFlightRecord(bytes);
    await tick(1, 300);
    const result = evaluateFlight(rec, player.name, currentTeam);
    await tick(2, 300);
    await tick(3, 250);
    await ulSleep(200);
    ulPending = { rec, result, fileName, kind, team: currentTeam, name: player.name };
    ulConfirm();
  } catch (e) {
    ulShow('pick', e.message);
  }
}

function ulTrackSVG(track) {
  const pts0 = track.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  if (pts0.length < 2) return '';
  const W = 320, H = 140, pad = 14, c = Math.cos(pts0[0].lat * Math.PI / 180);
  const xy = pts0.map(p => [p.lon * c, -p.lat]);
  const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const s = Math.min((W - 2 * pad) / (x1 - x0 || 1e-9), (H - 2 * pad) / (y1 - y0 || 1e-9));
  const ox = (W - (x1 - x0) * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  const P = xy.map(([x, y]) => [(x - x0) * s + ox, (y - y0) * s + oy]);
  const col = TEAM_COLOR[currentTeam];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="飛行の軌跡">
    <polyline id="ul-line" points="${P.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${P[0][0].toFixed(1)}" cy="${P[0][1].toFixed(1)}" r="4" fill="none" stroke="${col}" stroke-width="2"/>
    <g id="ul-dot" transform="translate(${P[0][0].toFixed(1)},${P[0][1].toFixed(1)})"><circle r="9" fill="${col}" opacity=".2"/><circle r="5" fill="${col}"/></g>
  </svg>`;
}

        <div class="dur">${Math.floor(sec / 60)}<small>分</small>${String(Math.floor(sec % 60)).padStart(2, '0')}<small>秒</small></div>
      </div>
      ${svg || `<div class="notrack">${rec.parse_level === 'summary' ? '経路なし（DJI ログの概要だけを読んでいます。経路は API キー発行後）' : '経路を表示できません'}</div>`}
      <dl class="facts">
        <div><dt>飛行距離</dt><dd>${Number.isFinite(rec.distance_m) ? (rec.distance_m >= 1000 ? (rec.distance_m / 1000).toFixed(2) + ' km' : Math.round(rec.distance_m) + ' m') : '—'}</dd></div>
        <div><dt>最高高度（離陸地点から）</dt><dd>${rec.max_height_m != null ? Math.round(rec.max_height_m) + ' m' : '—'}</dd></div>
        <div><dt>ファイル</dt><dd>${esc(fileName)}（${kind}）</dd></div>
        <div><dt>登録する人</dt><dd>${esc(name)}（Team ${team}）</dd></div>
      </dl>
      ${(rec.warnings || []).map(w => `<p class="warn">⚠ ${esc(w)}</p>`).join('')}`;
  if (r.blocked) {
    body += `<p class="blocked">${esc(r.blocked)}</p></div>
      <div class="row"><button class="btn" onclick="ulShow('pick')">やり直す</button></div>`;
  } else {
    body += `
      <div class="calc">
        <div><span>飛行 ${r.counted}分 × ${RULES.pointsPerMinute}pt</span><span>${r.base}pt</span></div>
        ${r.small ? `<div><span>3人チーム補正 ×4/3</span><span>+${r.bonus}pt</span></div>` : ''}
        <div class="total"><span>Team ${team} に入るポイント</span><span><span id="ul-total">${r.total}</span>pt</span></div>
      </div>
      ${r.notes.map(n => `<p class="note">${esc(n)}</p>`).join('')}
    </div>
    <div class="row"><button class="btn" onclick="ulShow('pick')">やり直す</button><button class="btn go" onclick="ulRegister()">登録する</button></div>`;
  }
  document.getElementById('ul').innerHTML = ulFrame('confirm', body);
  if (!r.blocked) ulCount(document.getElementById('ul-total'), r.total, 800);
  ulAnimateTrack();
}

function ulCount(el, to, ms) {
  if (!el) return;
  if (ulReduce || !to) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / ms); el.textContent = Math.round(to * (1 - (1 - k) ** 3)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function ulAnimateTrack() {
  const line = document.getElementById('ul-line'), dot = document.getElementById('ul-dot');
  if (!line || !dot || ulReduce) return;
  const len = line.getTotalLength(), t0 = performance.now();
  line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
  const step = now => {
    if (!document.body.contains(line)) return;
    const k = Math.min(1, (now - t0) / 1800), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    line.style.strokeDashoffset = len * (1 - e);
    const p = line.getPointAtLength(len * e);
    dot.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function ulRegister() {
  const { rec, result: r, fileName, team, name } = ulPending;
  if (r.blocked) return;
  flightLogs.push({
    fileSha256: rec.file_sha256, fileName, source: rec.source, player: name, team,
    startedAt: r.start, endedAt: r.end, durationSec: rec.duration_sec,
    day: r.day, countedMin: r.counted, pts: r.total, registeredAt: Date.now(),
  });
  // ① の地図に反映（PoC の registerFlight と同じ演出）
  points[team] += r.total;
  const d = drones[team].el;
  d.classList.remove('takeoff'); void d.offsetWidth; d.classList.add('takeoff');
  setTimeout(() => d.classList.remove('takeoff'), 1100);
  updateHud(team, 'pts');
  effect(toLngLat(...drones[team].pos), team, `+${r.total}pt`);
  refreshClaimable();
  ulPending = null;

  const pts = points[team];
  const can = [[`自陣の隣の空きマスを取る`, RULES.costNeutral], [`相手のマスを奪う`, RULES.costSteal]];
  document.getElementById('ul').innerHTML = ulFrame('done', `
    <div class="done">
      <p>登録しました</p>
      <div class="gain">+<span id="ul-gain">0</span>pt</div>
      <p class="sub">Team ${team} のポイント ${pts}pt</p>
    </div>
    <ul class="can">${can.map(([l, c]) => `<li class="${pts >= c ? '' : 'no'}"><span>${l}</span><span>${c}pt${pts >= c ? '' : '（足りません）'}</span></li>`).join('')}</ul>
    <div class="row"><button class="btn" onclick="ulShow('pick')">続けて登録</button><button class="btn go" onclick="ulGoMap()">地図で陣地を取る</button></div>`);
  ulCount(document.getElementById('ul-gain'), r.total, 800);
}

function ulGoMap() {
  closeUpload();
  showToast('黄色く光っているマスをタップすると取れます');
}

function showFlightLogs() {
  if (flying) return;
  const list = flightLogs.slice().reverse();
  document.getElementById('upload').hidden = false;
  document.getElementById('ul').innerHTML = `
    <div class="ul-head"><span class="title">登録した飛行ログ</span><button class="btn close" onclick="closeUpload()">閉じる</button></div>
    ${list.length ? `<ul class="loglist">${list.map(l => `<li><span>${fmtDate(l.startedAt)} ${fmtTime(l.startedAt)}　${esc(l.player)}（${l.team}）　${fmtDur(l.durationSec)}　${l.source.toUpperCase()}</span><b>+${l.pts}pt</b></li>`).join('')}</ul>`
      : '<p class="sub">まだありません。「＋ 飛行ログを登録」から登録できます。</p>'}
    <p class="sub" style="margin-top:10px">データはこのページの中だけに保存され、閉じると消えます（Supabase 未接続）。</p>`;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('upload').hidden) closeUpload(); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

</script>
</body>
</html>
