<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drone Territory Game</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --team-a: #378ADD;
    --team-b: #D85A30;
    --bg: #f5f4f0;
    --surface: #ffffff;
    --text: #2c2c2a;
    --text-sub: #5f5e5a;
    --border: rgba(100,100,100,0.25);
    --toast-bg: #2c2c2a;
    --toast-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a18;
      --surface: #252523;
      --text: #e8e7e2;
      --text-sub: #a3a29b;
      --border: rgba(200,200,200,0.18);
      --toast-bg: #e8e7e2;
      --toast-text: #1a1a18;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100dvh; }

  .header, .controls {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 8px 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; flex-shrink: 0;
  }
  .header { justify-content: space-between; }
  .header h1 { font-size: 15px; font-weight: 600; }
  .header h1 small { font-size: 11px; color: var(--text-sub); font-weight: 400; margin-left: 4px; }

  .teams { display: flex; gap: 10px; }
  .team-card {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 10px;
    border: 1.5px solid var(--border); font-variant-numeric: tabular-nums; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .team-card.active.a { border-color: var(--team-a); box-shadow: 0 0 0 3px rgba(55,138,221,0.2); }
  .team-card.active.b { border-color: var(--team-b); box-shadow: 0 0 0 3px rgba(216,90,48,0.2); }
  .team-card .name { font-size: 12px; font-weight: 700; }
  .team-card.a .name { color: var(--team-a); }
  .team-card.b .name { color: var(--team-b); }
  .stat { font-size: 13px; font-weight: 600; display: inline-block; }
  .stat small { font-size: 10px; color: var(--text-sub); font-weight: 400; margin-left: 1px; }
  .bump { animation: bump 0.4s ease; }
  @keyframes bump { 40% { transform: scale(1.35); } }

  .progress { flex-basis: 100%; height: 6px; display: flex; border-radius: 3px; overflow: hidden; background: var(--border); }
  .progress div { transition: width 0.4s ease; }

  .label { font-size: 12px; color: var(--text-sub); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    min-height: 36px; padding: 0 14px; border-radius: 18px;
    border: 1.5px solid var(--border); background: transparent; color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn.a { border-color: var(--team-a); color: var(--team-a); }
  .btn.b { border-color: var(--team-b); color: var(--team-b); }
  .btn.a.active { background: var(--team-a); color: #fff; }
  .btn.b.active { background: var(--team-b); color: #fff; }
  .btn.base.active { background: var(--text); color: var(--surface); border-color: var(--text); }
  .btn.fly { background: var(--text); color: var(--surface); border-color: var(--text); }
  .spacer { flex: 1; }

  #map { flex: 1; min-height: 0; position: relative; }

  .room-label {
    font-size: 11px; font-weight: 600; color: #2c2c2a;
    background: rgba(255,255,255,0.8); padding: 1px 5px; border-radius: 3px;
    pointer-events: none; white-space: nowrap; transition: background 0.3s, color 0.3s;
  }
  .room-label.cap-a { background: var(--team-a); color: #fff; }
  .room-label.cap-b { background: var(--team-b); color: #fff; }
  .hide-labels .room-label { display: none; }

  .base-label {
    font-size: 10px; font-weight: 800; color: #fff; padding: 2px 6px; border-radius: 8px;
    pointer-events: none; letter-spacing: 0.05em;
  }

  /* ドローン */
  .drone { width: 44px; height: 44px; pointer-events: none; }
  .drone .bob { width: 100%; height: 100%; animation: bob 1.6s ease-in-out infinite; }
  .drone .body { width: 100%; height: 100%; transition: transform 0.15s linear; }
  .drone .rotor { transform-box: fill-box; transform-origin: center; animation: spin 0.18s linear infinite; }
  .drone.takeoff .bob { animation: takeoff 1.1s ease-in-out; }
  .drone .shadow { position: absolute; left: 50%; top: 50%; width: 26px; height: 10px; margin: 14px 0 0 -13px;
    border-radius: 50%; background: rgba(0,0,0,0.25); filter: blur(2px); animation: shadow 1.6s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  @keyframes shadow { 50% { transform: scale(0.8); opacity: 0.6; } }
  @keyframes takeoff { 0% { transform: none; } 40% { transform: translateY(-22px) scale(1.25) rotate(180deg); } 100% { transform: rotate(360deg); } }

  /* 取得時の波紋 */
  .ripple { width: 18px; height: 18px; border-radius: 50%; border: 3px solid; pointer-events: none;
    animation: ripple 0.7s ease-out forwards; }
  @keyframes ripple { from { transform: scale(0.3); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
  .float-text { font-size: 13px; font-weight: 800; pointer-events: none; text-shadow: 0 1px 2px rgba(255,255,255,0.9);
    animation: floatup 0.9s ease-out forwards; }
  @keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-28px); opacity: 0; } }

  /* 制圧バナー */
  .banner {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0.6);
    padding: 14px 26px; border-radius: 14px; color: #fff; font-weight: 800; font-size: 20px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; z-index: 5; white-space: nowrap;
  }
  .banner small { display: block; font-size: 12px; font-weight: 600; opacity: 0.9; margin-top: 2px; }
  .banner.show { animation: banner 1.8s ease forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--toast-bg); color: var(--toast-text); padding: 8px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .header, .controls { padding: 8px 12px; }
    .hint { display: none; }
    .team-card { padding: 3px 8px; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Drone Territory<small>B棟9階 PoC（仮ルール・仮レイアウト）</small></h1>
    <div class="teams">
      <div class="team-card a active" id="card-A">
        <span class="name">A</span>
        <span class="stat" id="cells-A">0<small>マス</small></span>
        <span class="stat" id="pts-A">0<small>pt</small></span>
      </div>
      <div class="team-card b" id="card-B">
        <span class="name">B</span>
        <span class="stat" id="cells-B">0<small>マス</small></span>
        <span class="stat" id="pts-B">0<small>pt</small></span>
      </div>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="controls">
    <div class="seg">
      <button class="btn a active" id="btn-A" onclick="selectTeam('A')">Team A</button>
      <button class="btn b" id="btn-B" onclick="selectTeam('B')">Team B</button>
    </div>
    <button class="btn fly" onclick="registerFlight()">飛行ログを登録（デモ）</button>
    <span class="spacer"></span>
    <span class="label hint">光っているマスを取れる</span>
    <div class="seg">
      <button class="btn" onclick="fitFloor()">全体</button>
      <button class="btn base active" id="base-map" onclick="setBase('map')">地図</button>
      <button class="btn base" id="base-photo" onclick="setBase('photo')">写真</button>
      <button class="btn" onclick="resetGame()">リセット</button>
    </div>
  </div>

  <div id="map"><div class="banner" id="banner"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------
// 仮ルール（#4 ポイントルールで議論中。数値はここを変えれば調整できる）
// ---------------------------------------------------------------
const RULES = {
  startPoints: 5,        // 開始時のポイント
  pointsPerMinute: 1,    // 飛行1分あたりのポイント
  costNeutral: 1,        // 未取得マスを取るコスト
  costSteal: 2,          // 相手のマスを奪うコスト
  roomBonus: 3,          // 部屋をすべて取ったときのボーナス
  demoFlightMinutes: [3, 12], // デモ用：登録される飛行時間の範囲（分）
};

// B棟 9階部分の外形（OpenStreetMap way 361859629 より、© OpenStreetMap contributors / ODbL）
// 実際の間取り・向きとの対応は未決定。部屋の配置は仮レイアウト。
const FOOTPRINT = {
  north: [139.4029451, 35.5665866],
  east:  [139.4031858, 35.5663429],
  west:  [139.4027488, 35.5664583],
};

// 部屋の定義（Reara の PoC と同じ形式・同じ仮レイアウト）
const rooms = [
  { id: 'lab1',    label: '研究室A',     col: 0,  row: 0, cols: 6, rows: 5 },
  { id: 'lab2',    label: '研究室B',     col: 6,  row: 0, cols: 6, rows: 5 },
  { id: 'lab3',    label: '研究室C',     col: 12, row: 0, cols: 6, rows: 5 },
  { id: 'meeting', label: '会議室',      col: 18, row: 0, cols: 4, rows: 5 },
  { id: 'hall',    label: '廊下',        col: 0,  row: 5, cols: 22, rows: 2 },
  { id: 'server',  label: 'サーバー室',  col: 0,  row: 7, cols: 4, rows: 4 },
  { id: 'drone',   label: 'ドローン室',  col: 4,  row: 7, cols: 8, rows: 4 },
  { id: 'lounge',  label: 'ラウンジ',    col: 12, row: 7, cols: 6, rows: 4 },
  { id: 'storage', label: '倉庫',        col: 18, row: 7, cols: 4, rows: 4 },
];
const TOTAL_COLS = 22;
const TOTAL_ROWS = 11;

// 各チームの基地（廊下の両端。奪えない）
const BASES = { A: ['5,0', '6,0'], B: ['5,21', '6,21'] };
const TEAM_COLOR = { A: '#378ADD', B: '#D85A30' };
const other = t => (t === 'A' ? 'B' : 'A');

// ゲームの状態（cellState は Reara の PoC と同じ形式: "row,col" → 'A' | 'B' | null。将来 Supabase と連携予定）
let cellState, points, roomOwner, currentTeam = 'A', flying = false;

// ---------------------------------------------------------------
// 座標
// ---------------------------------------------------------------
function toLngLat(c, r) {
  const u = c / TOTAL_COLS, v = r / TOTAL_ROWS;
  const [nx, ny] = FOOTPRINT.north, [ex, ey] = FOOTPRINT.east, [wx, wy] = FOOTPRINT.west;
  return [nx + u * (ex - nx) + v * (wx - nx), ny + u * (ey - ny) + v * (wy - ny)];
}
function rect(c, r, w, h) {
  return [[toLngLat(c, r), toLngLat(c + w, r), toLngLat(c + w, r + h), toLngLat(c, r + h), toLngLat(c, r)]];
}
const keyOf = (r, c) => `${r},${c}`;
const idOf = key => { const [r, c] = key.split(',').map(Number); return r * TOTAL_COLS + c; };
const rcOf = key => key.split(',').map(Number);

const cellFeatures = [];
const cellRoom = {};   // key → room
rooms.forEach(room => {
  for (let r = 0; r < room.rows; r++) for (let c = 0; c < room.cols; c++) {
    const gr = room.row + r, gc = room.col + c, key = keyOf(gr, gc);
    cellRoom[key] = room;
    cellFeatures.push({ type: 'Feature', id: idOf(key), properties: { key },
      geometry: { type: 'Polygon', coordinates: rect(gc, gr, 1, 1) } });
  }
});
const roomFeatures = rooms.map((room, i) => ({ type: 'Feature', id: i, properties: { label: room.label },
  geometry: { type: 'Polygon', coordinates: rect(room.col, room.row, room.cols, room.rows) } }));

// ---------------------------------------------------------------
// 地図
// ---------------------------------------------------------------
const GSI = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>';
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron', // OpenFreeMap（APIキー不要）
  center: toLngLat(TOTAL_COLS / 2, TOTAL_ROWS / 2),
  zoom: 19, maxZoom: 22,
  pitchWithRotate: false, dragRotate: false,
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.once('style.load', () => {
  map.addSource('photo', { type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'],
    tileSize: 256, maxzoom: 18, attribution: GSI });
  map.addSource('cells', { type: 'geojson', data: { type: 'FeatureCollection', features: cellFeatures } });
  map.addSource('rooms', { type: 'geojson', data: { type: 'FeatureCollection', features: roomFeatures },
    attribution: 'B棟外形 © <a href="https://www.openstreetmap.org/way/361859629" target="_blank">OpenStreetMap contributors</a>' });
  map.addSource('trail', { type: 'geojson', data: emptyLine() });

  map.addLayer({ id: 'photo', type: 'raster', source: 'photo', layout: { visibility: 'none' } });
  map.addLayer({ id: 'cells-fill', type: 'fill', source: 'cells', paint: {
    'fill-color': ['match', ['feature-state', 'owner'], 'A', TEAM_COLOR.A, 'B', TEAM_COLOR.B, '#ffffff'],
    'fill-opacity': ['case',
      ['boolean', ['feature-state', 'base'], false], 0.9,
      ['boolean', ['feature-state', 'hover'], false], 0.8,
      ['any', ['==', ['feature-state', 'owner'], 'A'], ['==', ['feature-state', 'owner'], 'B']], 0.6,
      0.4],
    'fill-opacity-transition': { duration: 300 } } });
  map.addLayer({ id: 'cells-line', type: 'line', source: 'cells', paint: { 'line-color': '#5f5e5a', 'line-width': 0.5, 'line-opacity': 0.6 } });
  // 取れるマスの光る枠（点滅は pulse() で line-opacity を動かす）
  map.addLayer({ id: 'cells-claimable', type: 'line', source: 'cells', paint: {
    'line-color': '#f5c518', 'line-width': 2.5,
    'line-opacity': ['case', ['boolean', ['feature-state', 'claimable'], false], 1, 0],
    'line-opacity-transition': { duration: 800 } } });
  map.addLayer({ id: 'rooms-line', type: 'line', source: 'rooms', paint: {
    'line-color': ['match', ['feature-state', 'captured'], 'A', TEAM_COLOR.A, 'B', TEAM_COLOR.B, '#2c2c2a'],
    'line-width': ['case', ['any', ['==', ['feature-state', 'captured'], 'A'], ['==', ['feature-state', 'captured'], 'B']], 4, 2] } });
  map.addLayer({ id: 'trail', type: 'line', source: 'trail', layout: { 'line-cap': 'round' }, paint: {
    'line-color': ['get', 'color'], 'line-width': 3, 'line-dasharray': [1, 1.5], 'line-opacity': 0.9 } });

  fitFloor();
  addMarkers();
  resetGame(true);
  pulse();
});

function emptyLine() { return { type: 'FeatureCollection', features: [] }; }

// 建物の長辺が画面の長い方向に沿うように回転してフロア全体を表示する
function fitFloor() {
  const toM = (a, b) => { const k = 111320 * Math.cos(a[1] * Math.PI / 180); return [(b[0] - a[0]) * k, (b[1] - a[1]) * 111320]; };
  const long = toM(FOOTPRINT.north, FOOTPRINT.east), short = toM(FOOTPRINT.north, FOOTPRINT.west);
  const L = Math.hypot(...long), S = Math.hypot(...short);
  const azimuth = (Math.atan2(long[0], long[1]) * 180 / Math.PI + 360) % 360;
  const { clientWidth: W, clientHeight: H } = map.getContainer();
  const landscape = W >= H, pad = 32;
  const bearing = landscape ? azimuth - 90 : azimuth - 180;
  const mpp = landscape ? Math.max(L / (W - pad * 2), S / (H - pad * 2)) : Math.max(S / (W - pad * 2), L / (H - pad * 2));
  const center = toLngLat(TOTAL_COLS / 2, TOTAL_ROWS / 2);
  const zoom = Math.log2(40075016.686 * Math.cos(center[1] * Math.PI / 180) / (512 * mpp));
  map.jumpTo({ center, zoom: Math.min(zoom - 0.3, 22), bearing });
}
let lastLandscape = null;
window.addEventListener('resize', () => {
  const { clientWidth: W, clientHeight: H } = map.getContainer();
  if ((W >= H) !== lastLandscape) { lastLandscape = W >= H; fitFloor(); }
});

// ---------------------------------------------------------------
// マーカー（部屋名・基地・ドローン）
// ---------------------------------------------------------------
const roomLabels = {};
const drones = {};
function addMarkers() {
  rooms.forEach(room => {
    const el = document.createElement('div');
    el.className = 'room-label';
    el.textContent = room.label;
    roomLabels[room.id] = el;
    new maplibregl.Marker({ element: el }).setLngLat(toLngLat(room.col + room.cols / 2, room.row + room.rows / 2)).addTo(map);
  });
  ['A', 'B'].forEach(t => {
    const el = document.createElement('div');
    el.className = 'base-label';
    el.style.background = TEAM_COLOR[t];
    el.textContent = `${t} 基地`;
    const [r, c] = rcOf(BASES[t][0]);
    new maplibregl.Marker({ element: el, offset: [0, 18] }).setLngLat(toLngLat(c + 0.5, r + 1)).addTo(map);

    const d = document.createElement('div');
    d.className = 'drone';
    d.innerHTML = `<div class="shadow"></div><div class="bob"><div class="body">${droneSvg(TEAM_COLOR[t])}</div></div>`;
    drones[t] = { el: d, marker: new maplibregl.Marker({ element: d }).setLngLat(toLngLat(c + 0.5, r + 1)).addTo(map), pos: [c + 0.5, r + 1] };
  });
  map.on('zoom', updateLabels);
  updateLabels();
}
function setRoomLabel(id, owner) {
  const el = roomLabels[id];
  if (!el) return;
  el.classList.toggle('cap-a', owner === 'A');
  el.classList.toggle('cap-b', owner === 'B');
}
function updateLabels() { map.getContainer().classList.toggle('hide-labels', map.getZoom() < 19); }

function droneSvg(color) {
  const rotor = (x, y) => `<circle cx="${x}" cy="${y}" r="9" fill="rgba(255,255,255,0.35)" stroke="${color}" stroke-width="1.5"/>
    <g class="rotor"><rect x="${x - 8}" y="${y - 1.5}" width="16" height="3" rx="1.5" fill="#2c2c2a"/></g>`;
  return `<svg viewBox="0 0 44 44" width="44" height="44">
    <line x1="10" y1="10" x2="34" y2="34" stroke="#2c2c2a" stroke-width="3"/>
    <line x1="34" y1="10" x2="10" y2="34" stroke="#2c2c2a" stroke-width="3"/>
    ${rotor(10, 10)}${rotor(34, 10)}${rotor(10, 34)}${rotor(34, 34)}
    <rect x="15" y="15" width="14" height="14" rx="4" fill="${color}" stroke="#fff" stroke-width="1.5"/>
    <circle cx="22" cy="17.5" r="1.8" fill="#fff"/>
  </svg>`;
}

// ---------------------------------------------------------------
// ルール
// ---------------------------------------------------------------
function neighbors(key) {
  const [r, c] = rcOf(key);
  return [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].map(([a, b]) => keyOf(a, b)).filter(k => k in cellRoom);
}
function isBase(key) { return BASES.A.includes(key) || BASES.B.includes(key); }
function costOf(team, key) {
  const owner = cellState[key];
  if (owner === team || isBase(key)) return null;
  if (!neighbors(key).some(k => cellState[k] === team)) return null; // 自分の陣地に隣接していないと取れない
  return owner ? RULES.costSteal : RULES.costNeutral;
}

function refreshClaimable() {
  Object.keys(cellRoom).forEach(key => {
    const cost = costOf(currentTeam, key);
    map.setFeatureState({ source: 'cells', id: idOf(key) }, { claimable: cost !== null && cost <= points[currentTeam] });
  });
}

// 取れるマスの枠をゆっくり点滅させる（MapLibre のトランジションで補間。毎フレーム書き換えない）
function pulse() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let bright = true;
  setInterval(() => {
    bright = !bright;
    map.setPaintProperty('cells-claimable', 'line-opacity',
      ['case', ['boolean', ['feature-state', 'claimable'], false], bright ? 1 : 0.3, 0]);
  }, 800);
}

// ---------------------------------------------------------------
// 操作
// ---------------------------------------------------------------
map.on('click', 'cells-fill', e => {
  if (flying) return;
  const key = e.features[0].properties.key;
  const room = cellRoom[key];
  const cost = costOf(currentTeam, key);
  if (isBase(key)) return showToast('基地は奪えません');
  if (cellState[key] === currentTeam) return showToast(`${room.label} — すでに Team ${currentTeam} の陣地`);
  if (cost === null) return showToast('自分の陣地のとなりのマスだけ取れます');
  if (cost > points[currentTeam]) return showToast(`ポイントが足りません（${cost}pt 必要）— 飛行ログを登録しよう`);

  const team = currentTeam;
  const [r, c] = rcOf(key);
  points[team] -= cost;
  updateHud(team, 'pts');
  flyTo(team, [c + 0.5, r + 0.5], () => {
    const stolen = cellState[key] === other(team);
    cellState[key] = team;
    map.setFeatureState({ source: 'cells', id: idOf(key) }, { owner: team });
    effect(toLngLat(c + 0.5, r + 0.5), team, stolen ? `奪取 -${cost}pt` : `-${cost}pt`);
    showToast(stolen ? `Team ${team} が ${room.label} のマスを奪った！` : `Team ${team} が ${room.label} を獲得！`);
    checkRooms(team);
    updateHud(team, 'cells');
    refreshClaimable();
  });
});

let hoverId = null;
map.on('mousemove', 'cells-fill', e => {
  if (hoverId !== null) map.setFeatureState({ source: 'cells', id: hoverId }, { hover: false });
  hoverId = e.features[0].id;
  map.setFeatureState({ source: 'cells', id: hoverId }, { hover: true });
  map.getCanvas().style.cursor = 'pointer';
});
map.on('mouseleave', 'cells-fill', () => {
  if (hoverId !== null) map.setFeatureState({ source: 'cells', id: hoverId }, { hover: false });
  hoverId = null;
  map.getCanvas().style.cursor = '';
});

// ドローンを飛ばす（グリッド座標で補間して、軌跡を描く）
function flyTo(team, to, done) {
  const d = drones[team];
  const from = d.pos.slice();
  const dist = Math.hypot(to[0] - from[0], to[1] - from[1]);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const duration = reduce ? 0 : Math.min(400 + dist * 70, 1400);
  const p0 = map.project(toLngLat(...from)), p1 = map.project(toLngLat(...to));
  const heading = Math.atan2(p1.y - p0.y, p1.x - p0.x) * 180 / Math.PI + 90;
  d.el.querySelector('.body').style.transform = `rotate(${heading}deg)`;
  flying = true;
  const start = performance.now();
  const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  function step(now) {
    const t = duration ? Math.min((now - start) / duration, 1) : 1;
    const k = ease(t);
    const cur = [from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k];
    d.marker.setLngLat(toLngLat(...cur));
    map.getSource('trail').setData({ type: 'FeatureCollection', features: [{ type: 'Feature', properties: { color: TEAM_COLOR[team] },
      geometry: { type: 'LineString', coordinates: [toLngLat(...from), toLngLat(...cur)] } }] });
    if (t < 1) return requestAnimationFrame(step);
    d.pos = to;
    flying = false;
    setTimeout(() => map.getSource('trail').setData(emptyLine()), 250);
    done();
  }
  requestAnimationFrame(step);
}

// 取得時の波紋と浮かぶ文字
function effect(lnglat, team, text) {
  // マーカー要素自体の transform は MapLibre が位置指定に使うので、アニメーションは内側の要素にかける
  const add = (cls, offset, ms, setup) => {
    const wrap = document.createElement('div');
    wrap.style.pointerEvents = 'none';
    const inner = document.createElement('div');
    inner.className = cls;
    setup(inner);
    wrap.appendChild(inner);
    const m = new maplibregl.Marker({ element: wrap, offset }).setLngLat(lnglat).addTo(map);
    setTimeout(() => m.remove(), ms);
  };
  add('ripple', [0, 0], 750, el => { el.style.borderColor = TEAM_COLOR[team]; });
  if (text) add('float-text', [0, -16], 950, el => { el.style.color = TEAM_COLOR[team]; el.textContent = text; });
}

// 部屋をすべて取ったら制圧
function checkRooms(team) {
  rooms.forEach((room, i) => {
    const keys = Object.keys(cellRoom).filter(k => cellRoom[k] === room);
    const owner = keys.every(k => cellState[k] === team) ? team
      : keys.every(k => cellState[k] === other(team)) ? other(team) : null;
    if (owner === roomOwner[room.id]) return;
    const prev = roomOwner[room.id];
    roomOwner[room.id] = owner;
    map.setFeatureState({ source: 'rooms', id: i }, { captured: owner });
    setRoomLabel(room.id, owner);
    if (owner === team) {
      points[team] += RULES.roomBonus;
      updateHud(team, 'pts');
      showBanner(team, `Team ${team} が ${room.label} を制圧！`, `ボーナス +${RULES.roomBonus}pt`);
    } else if (prev && !owner) {
      showToast(`${room.label} の制圧が解除された`);
    }
  });
}

// 飛行ログ登録（デモ：ランダムな飛行時間でポイントを追加）
function registerFlight() {
  const team = currentTeam;
  const [lo, hi] = RULES.demoFlightMinutes;
  const min = lo + Math.floor(Math.random() * (hi - lo + 1));
  const gain = min * RULES.pointsPerMinute;
  const d = drones[team].el;
  d.classList.remove('takeoff'); void d.offsetWidth; d.classList.add('takeoff');
  setTimeout(() => d.classList.remove('takeoff'), 1100);
  points[team] += gain;
  updateHud(team, 'pts');
  effect(toLngLat(...drones[team].pos), team, `+${gain}pt`);
  showToast(`Team ${team}：${min}分 飛行 → +${gain}pt`);
  refreshClaimable();
}

function selectTeam(t) {
  currentTeam = t;
  ['A', 'B'].forEach(x => {
    document.getElementById('btn-' + x).classList.toggle('active', x === t);
    document.getElementById('card-' + x).classList.toggle('active', x === t);
  });
  refreshClaimable();
}

function setBase(name) {
  map.setLayoutProperty('photo', 'visibility', name === 'photo' ? 'visible' : 'none');
  document.getElementById('base-map').classList.toggle('active', name === 'map');
  document.getElementById('base-photo').classList.toggle('active', name === 'photo');
}

function resetGame(silent) {
  if (flying) return;
  cellState = {};
  points = { A: RULES.startPoints, B: RULES.startPoints };
  roomOwner = {};
  Object.keys(cellRoom).forEach(key => map.setFeatureState({ source: 'cells', id: idOf(key) }, { owner: null, base: false }));
  rooms.forEach((room, i) => { map.setFeatureState({ source: 'rooms', id: i }, { captured: null }); setRoomLabel(room.id, null); });
  ['A', 'B'].forEach(t => {
    BASES[t].forEach(key => { cellState[key] = t; map.setFeatureState({ source: 'cells', id: idOf(key) }, { owner: t, base: true }); });
    const [r, c] = rcOf(BASES[t][0]);
    drones[t].pos = [c + 0.5, r + 1];
    drones[t].marker.setLngLat(toLngLat(...drones[t].pos));
  });
  ['A', 'B'].forEach(t => { updateHud(t, 'pts', true); updateHud(t, 'cells', true); });
  refreshClaimable();
  if (!silent) showToast('リセットしました');
}

// ---------------------------------------------------------------
// 表示
// ---------------------------------------------------------------
function updateHud(team, what, quiet) {
  const el = document.getElementById(`${what}-${team}`);
  const value = what === 'pts' ? points[team] : Object.values(cellState).filter(v => v === team).length;
  el.innerHTML = `${value}<small>${what === 'pts' ? 'pt' : 'マス'}</small>`;
  if (!quiet) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  const total = cellFeatures.length;
  const a = Object.values(cellState).filter(v => v === 'A').length;
  const b = Object.values(cellState).filter(v => v === 'B').length;
  document.getElementById('progress').innerHTML =
    `<div style="width:${a / total * 100}%;background:var(--team-a)"></div>` +
    `<div style="flex:1"></div>` +
    `<div style="width:${b / total * 100}%;background:var(--team-b)"></div>`;
}

function showBanner(team, title, sub) {
  const b = document.getElementById('banner');
  b.style.background = TEAM_COLOR[team];
  b.innerHTML = `${title}<small>${sub}</small>`;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
